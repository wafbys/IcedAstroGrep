name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  build-and-test:
    # The tree targets net10.0-windows and uses WinForms plus WPF, so only a Windows runner can
    # build it. `-m:1 -nodeReuse:false` is NOT needed here: the single-node workaround exists only
    # for shells confined by a sandbox that blocks MSBuild's named-pipe node communication.
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore IcedAstroGrep.slnx

      - name: Build
        run: dotnet build IcedAstroGrep.slnx --no-restore -c Release

      - name: Test
        run: dotnet test IcedAstroGrep.slnx --no-build -c Release
